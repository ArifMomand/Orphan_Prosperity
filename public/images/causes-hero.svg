<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07152e"/>
      <stop offset="0.55" stop-color="#0f2a5c"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0f9ff"/>
      <stop offset="1" stop-color="#bae6fd"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7dd3fc" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7dd3fc" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <path id="heart" d="M0 14 C-22 -2 -14 -22 0 -10 C14 -22 22 -2 0 14 Z"/>
  </defs>

  <rect width="1600" height="700" fill="url(#bg)"/>

  <!-- soft light blobs -->
  <ellipse cx="1130" cy="330" rx="520" ry="330" fill="url(#glow)"/>
  <ellipse cx="260" cy="120" rx="320" ry="200" fill="#3b82f6" opacity="0.12"/>
  <path d="M900 700 C980 520 1250 470 1600 520 L1600 700 Z" fill="#38bdf8" opacity="0.10"/>

  <!-- stars / dots -->
  <g fill="#bae6fd" opacity="0.55">
    <circle cx="140" cy="90" r="3"/><circle cx="420" cy="60" r="2"/><circle cx="640" cy="130" r="3"/>
    <circle cx="820" cy="70" r="2"/><circle cx="1010" cy="110" r="3"/><circle cx="1260" cy="60" r="2"/>
    <circle cx="1480" cy="140" r="3"/><circle cx="1550" cy="300" r="2"/><circle cx="90" cy="330" r="2"/>
    <circle cx="300" cy="260" r="2"/><circle cx="560" cy="330" r="2"/>
  </g>

  <!-- floating hearts -->
  <g fill="#93c5fd">
    <use href="#heart" transform="translate(1000 150) scale(1.2)" opacity="0.85"/>
    <use href="#heart" transform="translate(1180 95) scale(0.8)" opacity="0.6"/>
    <use href="#heart" transform="translate(1330 190) scale(1.5)" opacity="0.5"/>
    <use href="#heart" transform="translate(860 215) scale(0.7)" opacity="0.5"/>
  </g>

  <!-- the giving hand -->
  <g transform="translate(1180 470) rotate(-14)">
    <!-- shadow -->
    <ellipse cx="-20" cy="190" rx="360" ry="34" fill="#020617" opacity="0.35" filter="url(#soft)"/>

    <!-- cuff / sleeve -->
    <rect x="270" y="-20" width="210" height="290" rx="26" fill="#0b1f46"/>
    <rect x="262" y="-20" width="30" height="290" rx="12" fill="#e0f2fe"/>

    <!-- fingers (pointing left) -->
    <g fill="url(#skin)" stroke="#7dd3fc" stroke-width="2" stroke-opacity="0.6">
      <rect x="-300" y="-6"  width="360" height="58" rx="29"/>
      <rect x="-360" y="58"  width="420" height="60" rx="30"/>
      <rect x="-330" y="124" width="390" height="58" rx="29"/>
      <rect x="-250" y="188" width="310" height="52" rx="26"/>
      <!-- thumb -->
      <rect x="-40" y="-110" width="250" height="60" rx="30" transform="rotate(-24 120 -80)"/>
      <!-- palm -->
      <rect x="0" y="-20" width="300" height="290" rx="80"/>
    </g>
    <!-- finger separation lines -->
    <g stroke="#7dd3fc" stroke-width="3" stroke-linecap="round" opacity="0.55">
      <line x1="-290" y1="55" x2="40" y2="55"/>
      <line x1="-350" y1="121" x2="40" y2="121"/>
      <line x1="-320" y1="185" x2="40" y2="185"/>
    </g>

    <!-- people standing on the palm -->
    <!-- adult 1 -->
    <g transform="translate(70 -2)">
      <circle cx="0" cy="-92" r="15" fill="#0b1f46"/>
      <path d="M-17 -72 h34 a8 8 0 0 1 8 8 v42 h-12 v38 h-10 v-38 h-6 v38 h-10 v-38 h-12 v-42 a8 8 0 0 1 8 -8 z" fill="#0b1f46"/>
    </g>
    <!-- adult 2 (blue) handing a heart -->
    <g transform="translate(150 6)">
      <circle cx="0" cy="-92" r="15" fill="#2563eb"/>
      <path d="M-17 -72 h34 a8 8 0 0 1 8 8 v42 h-12 v38 h-10 v-38 h-6 v38 h-10 v-38 h-12 v-42 a8 8 0 0 1 8 -8 z" fill="#2563eb"/>
      <rect x="-30" y="-62" width="26" height="8" rx="4" fill="#2563eb" transform="rotate(-18 -4 -58)"/>
      <use href="#heart" transform="translate(-44 -78) scale(0.9)" fill="#f43f5e"/>
    </g>
    <!-- child -->
    <g transform="translate(-4 8) scale(0.62)">
      <circle cx="0" cy="-92" r="15" fill="#f59e0b"/>
      <path d="M-17 -72 h34 a8 8 0 0 1 8 8 v42 h-12 v38 h-10 v-38 h-6 v38 h-10 v-38 h-12 v-42 a8 8 0 0 1 8 -8 z" fill="#f59e0b"/>
    </g>
  </g>

</svg>
